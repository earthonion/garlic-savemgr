name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        # The PS5 SDK's bin/clang etc. are wrappers that delegate to host
        # LLVM via prospero-llvm-config (which probes for llvm-config-15..21
        # in PATH). So the runner DOES need llvm/clang/lld installed — but
        # use versioned package names (clang-18, llvm-18, lld-18) because
        # the unversioned `clang` meta-package isn't in the default apt
        # sources of catthehacker/ubuntu:act-latest. GitHub-hosted runners
        # are not root, so apt-get needs sudo.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
              xxd bsdextrautils ca-certificates \
              clang-18 llvm-18 lld-18

      # Build the SDK from a pinned commit (same as Playstation-5-Save-Mounter)
      # instead of the moving "latest" release zip.
      - name: Checkout PS5 Payload SDK
        uses: actions/checkout@v4
        with:
          repository: ps5-payload-dev/sdk
          ref: 4eb701204fc3f8d31e84cf8ca272974e2be9c867
          submodules: recursive
          path: ps5-payload-sdk

      - name: Build and install SDK
        run: |
          export PS5_PAYLOAD_SDK="$GITHUB_WORKSPACE/ps5-sdk"
          make -C ps5-payload-sdk DESTDIR="$PS5_PAYLOAD_SDK" clean install
          echo "PS5_PAYLOAD_SDK=$PS5_PAYLOAD_SDK" >> "$GITHUB_ENV"

      # Tag builds take their version from the tag (v1.2.3 -> 1.2.3) so the
      # web UI matches the release; other builds keep the Makefile default.
      - name: Build
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
              make PS5_PAYLOAD_SDK="$PS5_PAYLOAD_SDK" VERSION="${GITHUB_REF_NAME#v}"
          else
              make PS5_PAYLOAD_SDK="$PS5_PAYLOAD_SDK"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: garlic-savemgr
          path: garlic-savemgr.elf

      - name: Publish GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.server_url == 'https://github.com' }}
        uses: softprops/action-gh-release@v2
        with:
          files: garlic-savemgr.elf
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          generate_release_notes: true

      - name: Create release (on tag push only)
        # Uses the Gitea/Forgejo /api/v1 release API, absent on github.com.
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.server_url != 'https://github.com' }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="${GITHUB_REF#refs/tags/}"
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"

          # Re-use existing release for the tag if present, else create one.
          REL_ID=$(curl -fsS -H "Authorization: token $TOKEN" \
              "$API/releases/tags/$TAG" 2>/dev/null \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("id",""))' \
              2>/dev/null || true)
          if [ -z "${REL_ID:-}" ]; then
              REL_ID=$(curl -fsS -X POST -H "Authorization: token $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"target_commitish\":\"$GITHUB_SHA\"}" \
                  "$API/releases" \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          fi

          # Overwrite the asset if it already exists, then upload.
          curl -fsS -H "Authorization: token $TOKEN" "$API/releases/$REL_ID/assets" \
              | python3 -c 'import json,sys; [print(a["id"]) for a in json.load(sys.stdin) if a["name"]=="garlic-savemgr.elf"]' \
              | while read aid; do
                  [ -n "$aid" ] && curl -fsS -X DELETE -H "Authorization: token $TOKEN" \
                      "$API/releases/$REL_ID/assets/$aid"
                done
          curl -fsS -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@garlic-savemgr.elf" \
              "$API/releases/$REL_ID/assets?name=garlic-savemgr.elf"
