name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        # The PS5 SDK ships its own prospero-clang + lld; the host only needs
        # tools for the pre-build step (xxd embeds ui.html into ui.h) and for
        # fetching/unzipping the SDK. llvm/clang/lld were previously listed
        # here but caused the apt step to fail on catthehacker/ubuntu:act-latest
        # (those packages aren't in the default sources) — and weren't needed
        # in the first place.
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
              xxd unzip ca-certificates curl

      - name: Download PS5 Payload SDK
        run: |
          curl -fLsS -o /tmp/ps5-payload-sdk.zip \
            https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          unzip -q /tmp/ps5-payload-sdk.zip -d /tmp

      - name: Build
        run: make PS5_PAYLOAD_SDK=/tmp/ps5-payload-sdk

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: garlic-savemgr
          path: garlic-savemgr.elf

      - name: Create release (on tag push only)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="${GITHUB_REF#refs/tags/}"
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"

          # Re-use existing release for the tag if present, else create one.
          REL_ID=$(curl -fsS -H "Authorization: token $TOKEN" \
              "$API/releases/tags/$TAG" 2>/dev/null \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("id",""))' \
              2>/dev/null || true)
          if [ -z "${REL_ID:-}" ]; then
              REL_ID=$(curl -fsS -X POST -H "Authorization: token $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"target_commitish\":\"$GITHUB_SHA\"}" \
                  "$API/releases" \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          fi

          # Overwrite the asset if it already exists, then upload.
          curl -fsS -H "Authorization: token $TOKEN" "$API/releases/$REL_ID/assets" \
              | python3 -c 'import json,sys; [print(a["id"]) for a in json.load(sys.stdin) if a["name"]=="garlic-savemgr.elf"]' \
              | while read aid; do
                  [ -n "$aid" ] && curl -fsS -X DELETE -H "Authorization: token $TOKEN" \
                      "$API/releases/$REL_ID/assets/$aid"
                done
          curl -fsS -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@garlic-savemgr.elf" \
              "$API/releases/$REL_ID/assets?name=garlic-savemgr.elf"
