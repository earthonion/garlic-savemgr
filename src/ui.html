<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GarlicMgr</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box }

    :root {
      --bg: #06060e; --s1: #0c0c1a; --bd: #1a1a35;
      --ac: #0070ff; --ac2: #00bbff; --gl: rgba(0,112,255,.15);
      --tx: #d0d0e4; --dm: #505068;
      --ok: #00dd77; --er: #ff2244; --lb: #040408;
    }

    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: radial-gradient(ellipse at 10% 40%, #0c1424, var(--bg) 65%);
      color: var(--tx); height: 100vh;
      display: flex; flex-direction: column; overflow: hidden;
    }

    ::-webkit-scrollbar { width: 5px }
    ::-webkit-scrollbar-track { background: transparent }
    ::-webkit-scrollbar-thumb { background: var(--bd); border-radius: 3px }

    /* ── Nav ─────────────────────────────────────────── */
    nav {
      height: 48px; background: var(--s1);
      border-bottom: 1px solid var(--bd);
      display: flex; align-items: center;
      padding: 0 20px; gap: 6px;
      flex-shrink: 0; position: relative;
    }
    nav::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--ac), transparent); opacity: .3;
    }

    .logo {
      font-size: 14px; font-weight: 800; letter-spacing: 3px;
      text-transform: uppercase; margin-right: 20px;
      background: linear-gradient(135deg, var(--ac), var(--ac2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .tab {
      background: none; border: 1px solid transparent; color: var(--dm);
      font-size: 11px; font-weight: 600; padding: 5px 14px;
      cursor: pointer; border-radius: 16px; transition: all .2s;
      letter-spacing: .5px; text-transform: uppercase;
    }
    .tab:hover { color: var(--tx); border-color: var(--bd) }
    .tab.active {
      color: #fff; background: var(--ac); border-color: var(--ac);
      box-shadow: 0 0 12px var(--gl);
    }

    .spacer { flex: 1 }

    .shut {
      background: none; border: 1px solid var(--er); color: var(--er);
      padding: 5px 12px; border-radius: 16px; cursor: pointer;
      font-size: 10px; font-weight: 700;
      letter-spacing: .5px; text-transform: uppercase; transition: all .2s;
    }
    .shut:hover { background: var(--er); color: #fff }

    /* ── Layout ──────────────────────────────────────── */
    .main { flex: 1; display: flex; overflow: hidden }
    .main.full .left { display: none }
    .main.full .right { border-left: none }

    .left {
      width: 300px; min-width: 220px; display: flex; flex-direction: column;
      border-right: 1px solid var(--bd); background: var(--s1);
    }

    .shdr {
      padding: 10px 16px; font-size: 10px; font-weight: 700; color: var(--dm);
      text-transform: uppercase; letter-spacing: 1.5px;
      border-bottom: 1px solid var(--bd); flex-shrink: 0;
    }
    .desk-shdr { display: flex; align-items: center; gap: 0 }

    /* ── Platform tabs ────────────────────────────────── */
    .ptab {
      background: none; border: 1px solid var(--bd); color: var(--dm);
      font-size: 13px; font-weight: 700; padding: 3px 12px;
      cursor: pointer; letter-spacing: .5px; text-transform: uppercase; transition: all .2s;
    }
    .ptab:first-of-type { border-radius: 10px 0 0 10px }
    .ptab:last-of-type { border-radius: 0 10px 10px 0 }
    .ptab.active { color: #fff; background: var(--ac); border-color: var(--ac) }
    .ptab:hover:not(.active) { color: var(--tx) }

    /* ── Save list ───────────────────────────────────── */
    .svs { flex: 1; overflow-y: auto }

    .sv {
      padding: 10px 14px; border-bottom: 1px solid rgba(26,26,53,.5);
      cursor: pointer; transition: all .15s; border-left: 2px solid transparent;
    }
    .sv:hover { background: rgba(255,255,255,.02) }
    .sv.sel {
      background: rgba(0,112,255,.08); border-left-color: var(--ac);
      box-shadow: inset 3px 0 8px -3px var(--gl);
    }
    .sv .tid { font-size: 12px; font-weight: 600; color: var(--tx); letter-spacing: .3px }
    .sv .sn {
      font-size: 11px; color: var(--dm); margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .badge { display:inline-block; font-size:9px; font-weight:700; padding:1px 5px; border-radius:3px; float:right; margin-left:6px }
    .badge-ps4 { background:#1e6fbf; color:#fff }
    .badge-ps5 { background:#1a8a3f; color:#fff }
    .badge-bu { background:#c89b00; color:#000 }
    .badge-usb { background:#8b5cf6; color:#fff }

    .bulk-bar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
      padding: 8px 10px; border-bottom: 1px solid var(--bd);
      background: var(--s1); flex-shrink: 0;
    }
    .bulk-bar .bulk-all {
      display: flex; align-items: center; gap: 6px;
      font-size: 10px; font-weight: 700; color: var(--dm);
      text-transform: uppercase; letter-spacing: .4px; cursor: pointer;
    }
    .bulk-bar .bulk-count { font-size: 10px; color: var(--dm); min-width: 72px }
    .bulk-bar .bulk-btn {
      background: var(--bd); border: none; color: var(--tx);
      font-size: 9px; font-weight: 700; padding: 5px 8px; border-radius: 10px;
      cursor: pointer; letter-spacing: .3px; text-transform: uppercase;
    }
    .bulk-bar .bulk-btn:hover:not(:disabled) { background: var(--gl); color: #fff }
    .bulk-bar .bulk-btn:disabled { opacity: .35; cursor: default }
    .bulk-bar .bulk-btn.grn { background: rgba(0,180,90,.25); color: #6f6 }
    .sv .bulk-cb {
      margin: 0 8px 0 0; accent-color: var(--ac); width: 14px; height: 14px;
      vertical-align: middle; flex-shrink: 0;
    }
    .sv .sv-row { display: flex; align-items: flex-start; }
    .sv .sv-body { flex: 1; min-width: 0 }

    /* ── Right panel ─────────────────────────────────── */
    .right { flex: 1; display: flex; flex-direction: column; overflow: hidden }

    .tb {
      padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      border-bottom: 1px solid var(--bd); background: var(--s1);
      flex-shrink: 0; min-height: 40px;
    }

    .btn {
      background: var(--ac); color: #fff; border: none;
      padding: 6px 16px; border-radius: 16px; cursor: pointer;
      font-size: 11px; font-weight: 700; letter-spacing: .4px;
      text-transform: uppercase; transition: all .2s;
    }
    .btn:hover { box-shadow: 0 0 12px var(--gl); filter: brightness(1.1) }
    .btn:disabled { opacity: .25; cursor: not-allowed; box-shadow: none; filter: none }
    .btn.red { background: var(--er) }
    .btn.grn { background: var(--ok); color: #000 }

    /* ── Content area ────────────────────────────────── */
    .ct { flex: 1; overflow-y: auto; display: flex; flex-direction: column }
    .ct.ctr { align-items: center; justify-content: center }

    .drop {
      border: 2px dashed var(--bd); border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 48px; transition: all .2s; gap: 10px;
      max-width: 380px; width: 90%;
    }
    .drop.over { border-color: var(--ac); background: rgba(0,112,255,.06) }

    .dico { font-size: 32px; opacity: .5 }
    .dlbl { color: var(--dm); font-size: 12px; text-align: center; line-height: 1.6 }
    .dlbl b { color: var(--tx) }

    .bbtn {
      background: var(--ac); color: #fff; border: none;
      padding: 8px 24px; border-radius: 16px; cursor: pointer;
      font-size: 11px; font-weight: 700; letter-spacing: .4px;
      text-transform: uppercase; transition: all .2s; margin-top: 4px;
    }
    .bbtn:hover { box-shadow: 0 0 12px var(--gl); filter: brightness(1.1) }

    .dlnk {
      display: inline-block; padding: 10px 24px;
      background: var(--ok); color: #000; border-radius: 16px;
      text-decoration: none; font-weight: 700; font-size: 12px;
      letter-spacing: .4px; text-transform: uppercase;
      transition: all .2s; margin-top: 8px;
    }
    .dlnk:hover { filter: brightness(1.1); box-shadow: 0 0 12px rgba(0,221,119,.3) }

    /* ── File listing ────────────────────────────────── */
    .fi { padding: 6px 16px; font-size: 14px; color: var(--tx); display: flex; align-items: center }
    .fi.dir { color: var(--ac2); font-weight: 600; cursor: pointer }
    .fi .sz { color: var(--dm); font-size: 12px; margin-left: auto }
    .dir-dots {
      color: var(--dm); font-size: 18px;
      cursor: pointer; padding: 0 4px; margin-left: 6px;
      opacity: .3; transition: opacity .15s; border-radius: 4px;
    }
    .fi.dir:hover .dir-dots { opacity: .7 }
    .dir-dots:hover { opacity: 1 !important; color: var(--tx); background: rgba(255,255,255,.05) }
    .title-dots {
      color: var(--dm); font-size: 18px;
      cursor: pointer; padding: 0 4px; margin-left: 6px;
      opacity: .7; transition: opacity .15s; border-radius: 4px;
    }
    .sv:hover .title-dots { opacity: .9 }
    .title-dots:hover { opacity: 1 !important; color: var(--tx); background: rgba(255,255,255,.05) }

    .empty { padding: 40px; text-align: center; color: var(--dm); font-size: 12px; letter-spacing: .3px }
    .dh { padding: 16px; text-align: center; color: var(--dm); font-size: 11px; opacity: .4; margin-top: auto }

    /* ── Log panel ───────────────────────────────────── */
    .logw {
      height: 150px; border-top: 1px solid var(--bd);
      display: flex; flex-direction: column;
      flex-shrink: 0; background: var(--lb); position: relative;
    }
    .logw::before {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,20,10,.04) 2px, rgba(0,20,10,.04) 4px);
      pointer-events: none; z-index: 1;
    }

    .log {
      flex: 1; overflow-y: auto; padding: 6px 14px;
      font-family: 'SF Mono', Consolas, monospace; font-size: 11px; line-height: 1.7;
    }

    .ll { color: #4a6a5a; animation: fadeIn .2s ease }
    .ll.err { color: var(--er) }
    .ll.ok { color: var(--ok) }
    .ll .t { opacity: .35; margin-right: 8px }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(2px) }
      to { opacity: 1; transform: none }
    }

    /* ── Modal ───────────────────────────────────────── */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,.6);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; backdrop-filter: blur(4px);
    }
    .modal {
      background: var(--s1); border: 1px solid var(--bd); border-radius: 12px;
      padding: 24px; max-width: 380px; width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
    }
    .modal h3 { font-size: 14px; color: var(--tx); margin-bottom: 8px }
    .modal p { font-size: 12px; color: var(--dm); margin-bottom: 20px; word-break: break-all }
    .modal .btns { display: flex; gap: 8px; justify-content: flex-end }
    .modal .btns button {
      padding: 8px 20px; border: none; border-radius: 16px;
      font-size: 11px; font-weight: 700; letter-spacing: .4px;
      text-transform: uppercase; cursor: pointer; transition: all .2s;
    }
    .modal .mbtn-r { background: var(--er); color: #fff }
    .modal .mbtn-r:hover { filter: brightness(1.2) }
    .modal .mbtn-s { background: var(--bd); color: var(--tx) }
    .modal .mbtn-s:hover { background: var(--dm) }

    /* ── Hex/Text editor ─────────────────────────────── */
    .editor-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; background: var(--s1);
      border-bottom: 1px solid var(--bd); flex-shrink: 0;
    }
    .editor-bar .ebtn {
      background: none; border: 1px solid var(--bd); color: var(--dm);
      font-size: 11px; font-weight: 600; padding: 4px 14px;
      cursor: pointer; border-radius: 12px; transition: all .2s;
      letter-spacing: .4px; text-transform: uppercase;
    }
    .editor-bar .ebtn:hover { color: var(--tx); border-color: var(--tx) }
    .editor-bar .ebtn.eact { color: #fff; background: var(--ac); border-color: var(--ac) }
    .editor-bar .ename {
      font-size: 12px; color: var(--tx); font-weight: 600;
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .editor-bar .esz { font-size: 11px; color: var(--dm); margin-left: auto }

    .hex-wrap {
      flex: 1; overflow: auto; font-family: 'SF Mono', Consolas, monospace;
      font-size: 14px; line-height: 1.6; padding: 8px 0;
    }
    .hex-row {
      display: flex; padding: 0 16px; white-space: pre;
    }
    .hex-row:hover { background: rgba(255,255,255,.02) }
    .hex-off { color: var(--dm); width: 80px; flex-shrink: 0; user-select: none }
    .hex-bytes { flex-shrink: 0 }
    .hex-bytes span { cursor: pointer; padding: 0 1px; border-radius: 2px }
    .hex-bytes span:hover { background: rgba(0,112,255,.2) }
    .hex-bytes span.dirty { color: var(--ok); font-weight: 700 }
    .hex-sep { width: 12px; flex-shrink: 0 }
    .hex-ascii { color: var(--ac2); flex-shrink: 0; flex: 1 }
    .hex-ascii span { cursor: pointer; border-radius: 2px }
    .hex-ascii span:hover { background: rgba(0,187,255,.15) }
    .hex-ascii span.dirty { color: var(--ok); font-weight: 700 }

    .hex-edit-input {
      background: var(--ac); color: #fff; border: none;
      font-family: inherit; font-size: inherit; font-weight: 700;
      width: 20px; text-align: center; padding: 0; border-radius: 2px;
      outline: none;
    }

    .text-wrap {
      flex: 1; position: relative; overflow: hidden;
    }
    .text-wrap textarea, .text-wrap pre {
      position: absolute; inset: 0; width: 100%; height: 100%;
      margin: 0; padding: 12px 16px;
      font-family: 'SF Mono', Consolas, monospace; font-size: 13px;
      line-height: 1.6; tab-size: 4; white-space: pre-wrap; word-wrap: break-word;
      border: none; resize: none; outline: none;
      overflow: auto; -webkit-overflow-scrolling: touch;
    }
    .text-wrap textarea {
      background: transparent; color: transparent; caret-color: var(--tx);
      z-index: 2;
    }
    .text-wrap textarea.text-plain {
      background: var(--bg); color: var(--tx); z-index: 1;
    }
    .text-wrap pre {
      background: var(--bg); color: var(--tx);
      z-index: 1; pointer-events: none;
    }
    /* syntax colors */
    .hl-key { color: #7cb8ff }
    .hl-str { color: #a5d6ff }
    .hl-num { color: #79c0ff }
    .hl-bool { color: #ff7b72 }
    .hl-null { color: #ff7b72; font-style: italic }
    .hl-tag { color: #7ee787 }
    .hl-attr { color: #d2a8ff }
    .hl-aval { color: #a5d6ff }
    .hl-cmt { color: #505068; font-style: italic }

    /* ── Context menu ────────────────────────────────── */
    .ctx-menu {
      position: fixed; background: var(--s1); border: 1px solid var(--bd);
      border-radius: 8px; padding: 4px 0; min-width: 140px;
      box-shadow: 0 4px 16px rgba(0,0,0,.5); z-index: 200;
    }
    .ctx-menu div {
      padding: 7px 14px; font-size: 12px; cursor: pointer;
      transition: background .1s;
    }
    .ctx-menu div:hover { background: rgba(255,255,255,.05) }
    .ctx-menu .ctx-del { color: var(--er) }

    /* ── Options dropdown ────────────────────────────── */
    .opts-menu {
      display: none; position: absolute; top: 100%; right: 0;
      background: var(--s1); border: 1px solid var(--bd);
      border-radius: 8px; padding: 4px 0; min-width: 200px;
      box-shadow: 0 4px 16px rgba(0,0,0,.5); z-index: 200;
      margin-top: 4px;
    }
    .opts-menu.open { display: block }
    .mob-opts { display: none; position: relative }
    .opts-menu div {
      padding: 9px 16px; font-size: 12px; cursor: pointer;
      transition: background .1s; white-space: nowrap;
    }
    .opts-menu div:hover { background: rgba(255,255,255,.05) }

    /* ── Progress bar ────────────────────────────────── */
    .prog {
      width: 100%; height: 4px; background: var(--bd);
      border-radius: 2px; margin-top: 8px; overflow: hidden;
    }
    .prog-fill {
      height: 100%; background: var(--ac); border-radius: 2px;
      transition: width .15s; width: 0%;
    }
    .prog-text {
      font-size: 11px; color: var(--dm); margin-top: 6px;
      font-family: 'SF Mono', Consolas, monospace;
    }

    /* ── Hamburger button (mobile only) ─────────────── */
    .hamburger {
      display: none; background: none; border: 1px solid var(--bd);
      color: var(--tx); padding: 6px 8px; border-radius: 6px;
      cursor: pointer; font-size: 18px; line-height: 1;
    }

    /* ── Mobile menu overlay ────────────────────────── */
    .mob-menu {
      display: none; position: fixed; top: 48px; left: 0; right: 0;
      background: var(--s1); border-bottom: 1px solid var(--bd);
      z-index: 50; flex-direction: column; padding: 8px 0;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }
    .mob-menu.open { display: flex }
    .mob-menu .tab {
      border-radius: 0; padding: 12px 20px; text-align: left;
      font-size: 13px; border: none;
    }
    .mob-menu .tab.active { border-radius: 0 }
    .mob-menu .shut {
      margin: 8px 16px; text-align: center;
    }

    /* ── Drawer toggle (mobile browse) ──────────────── */
    .drawer-toggle {
      display: none; padding: 10px 16px; background: var(--s1);
      border-bottom: 1px solid var(--bd); cursor: pointer;
      font-size: 11px; font-weight: 700; color: var(--dm);
      text-transform: uppercase; letter-spacing: 1px;
      flex-shrink: 0;
    }
    .drawer-toggle:hover { color: var(--tx) }

    /* ── Mobile ─────────────────────────────────────── */
    @media (max-width: 768px) {
      .hamburger { display: block }
      nav .tab, nav .shut { display: none }

      .main { flex-direction: column }
      .main .left {
        width: 100%; min-width: 0; border-right: none;
        border-bottom: 1px solid var(--bd);
        max-height: 50vh; flex-shrink: 0;
      }
      .main .left.collapsed .svs { display: none }
      .main .left.collapsed { max-height: none }
      .main.full .left { display: none }

      .drawer-toggle { display: block }
      .desk-shdr { display: none !important }

      .desk-btn { display: none !important }
      .mob-opts { display: inline-block !important }
      .tb { gap: 6px; padding: 8px 10px }
      .tb .btn { font-size: 10px; padding: 5px 10px }
      .tb img { width: 60px !important; height: 34px !important }

      .drop { padding: 24px 20px; max-width: 100%; width: 95% }

      .logw { height: 100px }

      .fi { font-size: 12px; padding: 6px 10px }
      .dir-dots { opacity: .5 }
    }

    /* ── User selector ────────────────────────────────── */
    .user-sel {
      position: relative; display: inline-flex; align-items: center;
      margin-right: 12px;
    }
    .user-btn {
      background: none; border: 1px solid var(--bd); color: var(--tx);
      font-size: 11px; font-weight: 600; padding: 4px 10px;
      cursor: pointer; border-radius: 12px; transition: all .2s;
      display: flex; align-items: center; gap: 4px;
    }
    .user-btn:hover { border-color: var(--ac); color: var(--ac) }
    .user-btn .arrow { font-size: 8px; color: var(--dm) }
    .user-dd {
      display: none; position: absolute; top: 100%; left: 0; margin-top: 4px;
      background: var(--s1); border: 1px solid var(--bd); border-radius: 8px;
      min-width: 140px; z-index: 100; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }
    .user-dd.open { display: block }
    .user-dd div {
      padding: 8px 12px; font-size: 11px; cursor: pointer; transition: background .1s;
    }
    .user-dd div:hover { background: var(--gl) }
    .user-dd div.active { color: var(--ac); font-weight: 700 }
  </style>
</head>
<body>

<!-- ── Navigation ──────────────────────────────────── -->
<nav>
  <span class="logo">GARLICMGR</span>
  <div class="user-sel" id="usersel">
    <button class="user-btn" onclick="toggleUserDD()"><span id="curuser" data-i18n="common.loading">Loading...</span> <span class="arrow">&#9662;</span></button>
    <div class="user-dd" id="userdd"></div>
  </div>
  <button class="tab active" data-tab="browse" data-i18n="nav.browse" onclick="switchTab('browse')">Browse</button>
  <button class="tab" data-tab="decrypt" data-i18n="nav.decrypt" onclick="switchTab('decrypt')">Decrypt</button>
  <button class="tab" data-tab="encrypt" data-i18n="nav.encrypt" onclick="switchTab('encrypt')">Encrypt</button>
  <button class="tab" data-tab="resign" data-i18n="nav.resign" onclick="switchTab('resign')">Resign</button>
  <button class="tab" data-tab="import" data-i18n="nav.import" onclick="switchTab('import')">Import</button>
  <button class="tab" data-tab="settings" data-i18n="nav.settings" onclick="switchTab('settings')">Settings</button>
  <span class="spacer"></span>
  <button class="shut" data-i18n="nav.kill" onclick="shutdown()">Kill GarlicMgr</button>
  <span style="font-size:10px;color:#ffeb3b;margin-left:4px">__VERSION__</span>
  <button class="hamburger" onclick="toggleMenu()">&#9776;</button>
</nav>
<div class="mob-menu" id="mobmenu">
  <button class="tab active" data-tab="browse" data-i18n="nav.browse" onclick="switchTab('browse')">Browse</button>
  <button class="tab" data-tab="decrypt" data-i18n="nav.decrypt" onclick="switchTab('decrypt')">Decrypt</button>
  <button class="tab" data-tab="encrypt" data-i18n="nav.encrypt" onclick="switchTab('encrypt')">Encrypt</button>
  <button class="tab" data-tab="resign" data-i18n="nav.resign" onclick="switchTab('resign')">Resign</button>
  <button class="tab" data-tab="import" data-i18n="nav.import" onclick="switchTab('import')">Import</button>
  <button class="tab" data-tab="settings" data-i18n="nav.settings" onclick="switchTab('settings')">Settings</button>

<script>
window.GARLIC_I18N = {};
"__I18N_DICTIONARIES__";

const DEFAULT_LANG = 'en';
const LANGUAGE_OPTIONS = [
  { value: 'en', label: 'English' },
  { value: 'zh-CN', label: '简体中文' }
];
const SUPPORTED_LANGS = LANGUAGE_OPTIONS.map(option => option.value);
const savedLanguage = localStorage.getItem('garlic_lang');
let langPreference = savedLanguage && SUPPORTED_LANGS.includes(savedLanguage)
  ? savedLanguage : 'system';
if (savedLanguage && langPreference === 'system') localStorage.removeItem('garlic_lang');

function systemLanguage() {
  const browserLangs = navigator.languages && navigator.languages.length
    ? navigator.languages : [navigator.language || DEFAULT_LANG];
  for (const browserLang of browserLangs) {
    const normalized = String(browserLang).toLowerCase();
    if (normalized === 'zh' || normalized === 'zh-cn' || normalized.startsWith('zh-hans')) return 'zh-CN';
    if (normalized === 'en' || normalized.startsWith('en-')) return 'en';
  }
  return DEFAULT_LANG;
}

function resolveLanguage(preference) {
  if (preference === 'system') return systemLanguage();
  return SUPPORTED_LANGS.includes(preference) ? preference : DEFAULT_LANG;
}

let lang = resolveLanguage(langPreference);

function t(key, fallback, vars) {
  const dict = (window.GARLIC_I18N && window.GARLIC_I18N[lang]) || {};
  let text = dict[key] || fallback || key;
  if (vars) Object.keys(vars).forEach(name => {
    text = text.split('{' + name + '}').join(String(vars[name]));
  });
  return text;
}

function applyLanguage() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    if (!el.dataset.i18nEn) el.dataset.i18nEn = el.textContent;
    el.textContent = t(el.dataset.i18n, el.dataset.i18nEn);
  });
}

function setLanguage(value) {
  langPreference = value === 'system' ? 'system'
    : (SUPPORTED_LANGS.includes(value) ? value : 'system');
  if (langPreference === 'system') localStorage.removeItem('garlic_lang');
  else localStorage.setItem('garlic_lang', langPreference);
  lang = resolveLanguage(langPreference);
  applyLanguage();
  renderL();
  renderTB();
  renderCt();
}

function languageOptionLabel(value) {
  if (value === 'system') return t('settings.language_system', 'System / Browser Default');
  const option = LANGUAGE_OPTIONS.find(item => item.value === value);
  return option ? option.label : value;
}

function languageOptionsHtml() {
  const system = '<option value="system"' + (langPreference === 'system' ? ' selected' : '')
    + '>' + languageOptionLabel('system') + '</option>';
  return system + LANGUAGE_OPTIONS.map(option =>
    '<option value="' + esc(option.value) + '"' + (langPreference === option.value ? ' selected' : '')
    + '>' + esc(option.label) + '</option>'
  ).join('');
}

/* ── State ─────────────────────────────────────────── */
let S = [], si = -1, tab = 'browse';
let mt = false, bsy = false;
let cf = [], ex = new Set();
let aid = '', stitle = '', mtid = '', mpt = '';
let cloudPoll = null, cloudAwaiting = false, cloudBusy = false, lastCloudProgress = '';
let bulkSel = new Set(), bulkRunning = false;

/* ── Utilities ─────────────────────────────────────── */
function $(id) { return document.getElementById(id) }

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function log(m, c) {
  const d = $('log'), t = new Date().toLocaleTimeString();
  d.innerHTML += '<div class="ll' + (c ? ' ' + c : '') + '">'
    + '<span class="t">' + t + '</span>' + esc(m) + '</div>';
  d.scrollTop = d.scrollHeight;
}

function fmtB(b) {
  if (b < 1024) return b + 'B';
  if (b < 1048576) return (b / 1024).toFixed(1) + 'K';
  return (b / 1048576).toFixed(1) + 'M';
}

/* ── XHR upload with progress ──────────────────────── */
function upload(url, file, onProgress, respType) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url);
    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
    if (respType) xhr.responseType = respType;
    xhr.timeout = 300000; /* 5 min timeout for large saves */
    xhr.upload.onprogress = e => {
      if (e.lengthComputable && onProgress) onProgress(e.loaded, e.total);
    };
    xhr.onload = () => resolve(xhr);
    xhr.onerror = () => reject(new Error('Network error'));
    xhr.ontimeout = () => reject(new Error('Timeout'));
    xhr.send(file);
  });
}

function showProgress(pct, loaded, total) {
  let el = document.getElementById('upprog');
  if (!el) {
    const ct = $('ct');
    const drop = ct.querySelector('.drop');
    if (!drop) return;
    el = document.createElement('div');
    el.id = 'upprog';
    el.innerHTML = '<div class="prog"><div class="prog-fill"></div></div><div class="prog-text"></div>';
    drop.appendChild(el);
  }
  el.querySelector('.prog-fill').style.width = pct + '%';
  el.querySelector('.prog-text').textContent = fmtB(loaded) + ' / ' + fmtB(total) + ' (' + pct + '%)';
}

/* ── Drag & drop zone setup ────────────────────────── */
function setupDZ(id, fn) {
  const el = $(id);
  if (!el) return;
  el.ondragover = e => { e.preventDefault(); el.classList.add('over') };
  el.ondragleave = e => { e.preventDefault(); el.classList.remove('over') };
  el.ondrop = e => {
    e.preventDefault(); el.classList.remove('over');
    if (e.dataTransfer.files.length) fn(e.dataTransfer.files);
  };
  const b = el.querySelector('.bbtn');
  if (b) b.onclick = e => {
    e.stopPropagation();
    const i = document.createElement('input');
    i.type = 'file'; i.multiple = true;
    i.onchange = () => { if (i.files.length) fn(i.files) };
    i.click();
  };
}

/* ── Folder drag & drop zone setup ────────────────── */
function setupFolderDZ(id, fn) {
  const el = $(id);
  if (!el) return;
  el.ondragover = e => { e.preventDefault(); el.classList.add('over') };
  el.ondragleave = e => { e.preventDefault(); el.classList.remove('over') };
  el.ondrop = async e => {
    e.preventDefault(); el.classList.remove('over');
    const items = e.dataTransfer.items;
    if (!items || !items.length) return;
    const files = [];
    const entries = [];
    for (let i = 0; i < items.length; i++) {
      const entry = items[i].webkitGetAsEntry ? items[i].webkitGetAsEntry() : null;
      if (entry) entries.push(entry);
    }
    if (entries.length && entries[0].isDirectory) {
      const all = await readEntryRecursive(entries[0], '');
      if (all.length) fn(all, entries[0].name);
    } else if (e.dataTransfer.files.length) {
      fn(Array.from(e.dataTransfer.files));
    }
  };
  const b = el.querySelector('.bbtn');
  if (b) b.onclick = e => {
    e.stopPropagation();
    const i = document.createElement('input');
    i.type = 'file'; i.webkitdirectory = true;
    i.onchange = () => {
      if (i.files.length) {
        const prefix = i.files[0].webkitRelativePath.split('/')[0];
        fn(Array.from(i.files), prefix);
      }
    };
    i.click();
  };
}

/* ── Recursively read folder entries ──────────────── */
function readEntryRecursive(entry, basePath) {
  return new Promise(resolve => {
    if (entry.isFile) {
      entry.file(f => {
        f._path = basePath + f.name;
        resolve([f]);
      });
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      const all = [];
      const readBatch = () => {
        reader.readEntries(entries => {
          if (!entries.length) {
            Promise.all(all).then(arrs => resolve(arrs.flat()));
            return;
          }
          for (const e of entries) {
            all.push(readEntryRecursive(e, basePath + entry.name + '/'));
          }
          readBatch();
        });
      };
      readBatch();
    } else {
      resolve([]);
    }
  });
}

function toggleDrawer() {

  updateDrawer();
}
function updateDrawer() {

}

/* ── User selector ─────────────────────────────────── */
let users = [];
let curUid = '';

async function loadUsers() {
  try {
    const r = await fetch('/api/users');
    const d = await r.json();
    users = d.users || [];
    if (users.length > 0) {
      curUid = users[0].id;
      $('curuser').textContent = users[0].name;
    }
    if (users.length <= 1) $('usersel').querySelector('.arrow').style.display = 'none';
  } catch(e) {}
}

function toggleUserDD() {
  if (users.length <= 1) return;
  const dd = $('userdd');
  dd.classList.toggle('open');
  dd.innerHTML = users.map(u =>
    '<div class="' + (u.id === curUid ? 'active' : '') + '" onclick="selectUser(\'' + u.id + '\')">' + esc(u.name) + '</div>'
  ).join('');
}

function selectUser(uid) {
  curUid = uid;
  const u = users.find(x => x.id === uid);
  $('curuser').textContent = u ? u.name : uid;
  $('userdd').classList.remove('open');
  si = -1; mt = null; cf = [];
  renderL(); renderTB(); renderCt(); updateDrawer();
}

document.addEventListener('click', e => {

});

/* ── Tab switching ─────────────────────────────────── */
function switchTab(t) {
  tab = t;
  document.querySelectorAll('nav .tab, .mob-menu .tab').forEach(b => {
    b.className = 'tab' + (b.dataset.tab === t ? ' active' : '');
  });
  $('mn').className = t === 'browse' ? 'main' : 'main full';
  /* Close mobile menu */
  $('mobmenu').classList.remove('open');
  if (t === 'browse') load();
  renderTB();
  renderCt();
}

/* ── Load saves list ───────────────────────────────── */
async function load() {
  try {
    const r = await fetch('/api/saves');
    const d = await r.json();
    S = d.saves || [];
    bulkSel.clear();
    renderL();
    renderTB();
    updateDrawer();
    log(t('status.loaded_saves', 'Loaded {count} saves', {count: S.length}), 'ok');
  } catch (e) {
    log(t('status.failed', 'Failed: {error}', {error: e.message}), 'err');
    S = [];
    renderL();
  }
}

/* ── Render save list (left panel) ─────────────────── */
let exG = new Set(); /* expanded groups */
let usbDrawerOpen = false;
let platform = 'ps5';

function setPlatform(p) {
  platform = p;
  $('ptab5').className = 'ptab' + (p === 'ps5' ? ' active' : '');
  $('ptab4').className = 'ptab' + (p === 'ps4' ? ' active' : '');
  si = -1; mt = null; cf = [];
  bulkSel.clear();
  renderL(); renderTB(); renderCt(); updateDrawer();
}

function bulkTitleCheckbox(titleId, anyUsb) {
  if (anyUsb) return '<span style="width:22px;flex-shrink:0"></span>';
  const on = bulkSel.has(titleId) ? ' checked' : '';
  const tid = esc(titleId).replace(/'/g, "\\'");
  return '<input type="checkbox" class="bulk-cb" onclick="event.stopPropagation();toggleBulkTitle(\'' + tid + '\')"' + on + '>';
}

function visibleBulkTitles() {
  const ptype = platform === 'ps4' ? 'ps4' : 'ps5';
  const ids = new Set();
  S.forEach(s => {
    if (s.type === ptype && !s.usb && s.uid === curUid) ids.add(s.title_id);
  });
  return [...ids].sort();
}

function toggleBulkTitle(titleId) {
  if (bulkSel.has(titleId)) bulkSel.delete(titleId);
  else bulkSel.add(titleId);
  updateBulkBar();
  renderL();
}

function onBulkSelectAll(checked) {
  const vis = visibleBulkTitles();
  if (checked) vis.forEach(t => bulkSel.add(t));
  else vis.forEach(t => bulkSel.delete(t));
  updateBulkBar();
  renderL();
}

function updateBulkBar() {
  const vis = visibleBulkTitles();
  const n = vis.filter(t => bulkSel.has(t)).length;
  const cnt = $('bulkCount');
  if (cnt) cnt.textContent = t('bulk.titles', '{count} titles', {count: n});
  const all = $('bulkSelectAll');
  if (all) {
    all.checked = vis.length > 0 && n === vis.length;
    all.indeterminate = n > 0 && n < vis.length;
  }
  const dis = bsy || bulkRunning || n === 0;
  ['bulkDec', 'bulkEnc', 'bulkCloud'].forEach(id => {
    const b = $(id);
    if (b) b.disabled = dis;
  });
}

function renderGroup(g, h) {
  const gtype = S[g.items[0]].type || 'ps5';
  const badge = '<span class="badge badge-' + gtype + '">' + gtype.toUpperCase() + '</span>';
  const anyUsb = g.items.every(i => S[i].usb);
  const gkey = (anyUsb ? 'usb:' : '') + g.title_id;
  const tdots = '<span class="title-dots" onclick="event.stopPropagation();showTitleMenu(event,\'' + esc(g.title_id).replace(/'/g, "\\'") + '\',' + anyUsb + ')">\u22EE</span>';
  function saveDots(idx) {
    return '<span class="title-dots" onclick="event.stopPropagation();showSaveMenu(event,' + idx + ')">\u22EE</span>';
  }
  if (g.items.length === 1) {
    const i = g.items[0], s = S[i];
    const bu = s.backup ? '<span class="badge badge-bu">' + t('badge.backup', 'BACKUP') + '</span>' : '';
    h += '<div class="sv' + (i === si ? ' sel' : '') + '" onclick="sel(' + i + ')">';
    h += '<div class="sv-row">' + bulkTitleCheckbox(g.title_id, anyUsb);
    h += '<div class="sv-body"><div class="tid">' + bu + badge + esc(g.name) + tdots + '</div>';
    h += '<div class="sn">' + esc(s.save_name) + '</div></div></div></div>';
  } else {
    const open = exG.has(gkey);
    const anySel = g.items.includes(si);
    const gesc = esc(gkey).replace(/'/g, "\\'");
    h += '<div class="sv' + (anySel ? ' sel' : '') + '" onclick="togG(\'' + gesc + '\',event)" style="cursor:pointer">';
    h += '<div class="sv-row">' + bulkTitleCheckbox(g.title_id, anyUsb);
    h += '<div class="sv-body"><div class="tid">' + badge + (open ? '\u25BE ' : '\u25B8 ') + esc(g.name) + tdots + '</div>';
    h += '<div class="sn">' + esc(t('saves.count', '{count} saves', {count: g.items.length})) + '</div></div></div></div>';
    if (open) {
      g.items.forEach(i => {
        const s = S[i];
        const bu = s.backup ? '<span class="badge badge-bu">' + t('badge.backup', 'BACKUP') + '</span>' : '';
        const dots = saveDots(i);
        h += '<div class="sv' + (i === si ? ' sel' : '') + '" onclick="sel(' + i + ')" style="padding-left:16px">';
        h += '<div class="sv-row"><span style="width:22px;flex-shrink:0"></span>';
        h += '<div class="sv-body"><div class="sn" style="color:var(--tx)">' + bu + esc(s.save_name) + dots + '</div></div></div></div>';
      });
    }
  }
  return h;
}

function renderL() {
  const ptype = platform === 'ps4' ? 'ps4' : 'ps5';
  const filtered = S.map((s, i) => ({s, i})).filter(x => x.s.type === ptype && (x.s.usb || x.s.uid === curUid));
  if (!filtered.length) {
    $('svs').innerHTML = '<div class="empty">' + esc(t('saves.none', 'No {platform} saves found', {platform: ptype.toUpperCase()})) + '</div>';
    return;
  }
  /* Group saves by title_id, split system vs USB */
  const sysGroups = [], usbGroups = [];
  const sysMap = {}, usbMap = {};
  filtered.forEach(({s, i}) => {
    if (s.usb) {
      if (!usbMap[s.title_id]) {
        usbMap[s.title_id] = { title_id: s.title_id, name: s.title_name || s.title_id, items: [] };
        usbGroups.push(usbMap[s.title_id]);
      }
      usbMap[s.title_id].items.push(i);
    } else {
      if (!sysMap[s.title_id]) {
        sysMap[s.title_id] = { title_id: s.title_id, name: s.title_name || s.title_id, items: [] };
        sysGroups.push(sysMap[s.title_id]);
      }
      sysMap[s.title_id].items.push(i);
    }
  });

  let h = '';
  sysGroups.forEach(g => { h = renderGroup(g, h); });

  if (usbGroups.length > 0) {
    h += '<div class="sv" onclick="event.stopPropagation();usbDrawerOpen=!usbDrawerOpen;renderL()" style="cursor:pointer;border-top:1px solid var(--bd);margin-top:4px">';
    h += '<div class="tid" style="color:#8b5cf6;font-weight:700">'
      + (usbDrawerOpen ? '\u25BE' : '\u25B8') + ' USB ' + esc(t('layout.saves', 'Saves'))
      + '<span class="badge badge-usb" style="float:none;margin-left:8px">' + usbGroups.length + '</span></div></div>';
    if (usbDrawerOpen) {
      usbGroups.forEach(g => { h = renderGroup(g, h); });
    }
  }

  $('svs').innerHTML = h;
  updateBulkBar();
}

function togG(tid, e) {
  if (e) e.stopPropagation();
  if (exG.has(tid)) exG.delete(tid); else exG.add(tid);
  renderL();
}

      + 'style="background:var(--bg);border:1px solid var(--bd);color:var(--tx);padding:6px 10px;border-radius:8px;font-family:monospace;font-size:13px;width:170px">'
      + '</div>'
      + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">'
      + '<label style="cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dm);font-weight:600;text-transform:uppercase;letter-spacing:.5px">'
      + '<input id="eps4" type="checkbox" style="accent-color:#1e6fbf;width:16px;height:16px"> ' + t('encrypt.ps4_save', 'PS4 Save')
      + '</label>'
      + '</div>'
      + '<div class="drop" id="dz">'
      + '<div class="dlbl">' + t('drop.encrypt', 'Drag & drop a folder to encrypt into a save') + '</div>'
      + '<button class="bbtn">' + t('drop.browse_folder', 'Browse Folder') + '</button></div>';
    setupFolderDZ('dz', encDrop);

  } else if (tab === 'resign') {
    c.className = 'ct ctr';
    c.innerHTML =
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">'
      + '<label style="font-size:12px;color:var(--dm);font-weight:600;text-transform:uppercase;letter-spacing:.5px">' + t('resign.new_account_id', 'New Account ID') + ':</label>'
      + '<input id="raid" type="text" maxlength="16" placeholder="0000000000000000" '

  if ($('driveOAuthRefreshSettings')) $('driveOAuthRefreshSettings').style.display = (p === 'google_drive' && a === 'oauth_refresh') ? 'block' : 'none';

function normalizeDriveToken(token) {
  token = (token || '').trim();
  if ((token[0] === '"' && token[token.length - 1] === '"') || (token[0] === "'" && token[token.length - 1] === "'")) {
    token = token.slice(1, -1).trim();
  }
  if (token.toLowerCase().startsWith('bearer ')) token = token.slice(7).trim();
  return token;
}

async function saveCloudSettings() {
  const watch = ($('setWatch').value || '').split(',').map(x => x.trim()).filter(Boolean);
  const driveAuth = $('setDriveAuth') ? $('setDriveAuth').value : 'oauth_refresh';
  localStorage.setItem('gdrive_auth_mode', driveAuth);
  const accessToken = normalizeDriveToken($('setDriveAccessToken') ? $('setDriveAccessToken').value : '');
  if (accessToken && accessToken !== '********') localStorage.setItem('gdrive_access_token', accessToken);
  const saText = ($('setDriveServiceAccount') ? $('setDriveServiceAccount').value : '').trim();
  let serviceAccount = {};
  if (driveAuth === 'service_account' && saText) {
    try {
      serviceAccount = JSON.parse(saText);
      localStorage.setItem('gdrive_service_account', JSON.stringify(serviceAccount, null, 2));
    } catch (e) {
      log('Service account JSON is invalid: ' + e.message, 'err');
      return;
    }
  }
  const cfg = {
    enabled: $('setEnabled').checked,
    provider: $('setProvider').value,
    watch_titles: watch,
    ftp: {
      host: $('setFtpHost').value.trim(),
      port: parseInt($('setFtpPort').value || '21', 10),
      user: $('setFtpUser').value.trim(),
      pass: $('setFtpPass').value,
      remote_path: $('setFtpPath').value.trim() || '/',
      use_tls: $('setFtpTls').checked
    },
    backup_targets: {
      local: {
        enabled: $('setTargetLocal').checked,
        path: $('setTargetLocalPath').value.trim() || '/data/garlic/backups'
      },
      usb: {
        enabled: $('setTargetUsb').checked,
        path: $('setTargetUsbPath').value.trim() || '/mnt/usb0/garlic-backups'
      },
      ftp: { enabled: $('setTargetFtp').checked },
      google_drive: { enabled: $('setTargetDrive').checked }
    },
    google_drive: {
      mode: $('setDriveMode').value,
      auth_mode: driveAuth,
      folder_id: $('setDriveFolder').value.trim(),
      client_id: $('setDriveClientId') ? $('setDriveClientId').value.trim() : '',
      client_secret: $('setDriveClientSecret') ? $('setDriveClientSecret').value : '',
      refresh_token: $('setDriveRefreshToken') ? $('setDriveRefreshToken').value.trim() : '',
      access_token: $('setDriveAccessToken') ? $('setDriveAccessToken').value.trim() : '',
      service_account: $('setDriveSaveSa').checked ? serviceAccount : {}
    },
    auto_backup: {
      enabled: $('setAutoEnabled').checked,
      auto_enabled: $('setAutoEnabled').checked,
      poll_seconds: parseInt($('setAutoPoll').value || '5', 10),
      settle_seconds: parseInt($('setAutoSettle').value || '15', 10),
      queue_for_browser_drive: $('setAutoQueueDrive').checked
    }
  };
  try {
    const r = await fetch('/api/settings/cloud', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cfg)
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    log('Cloud settings saved', 'ok');
    renderSettings();
  } catch (e) {
    log('Save settings failed: ' + e.message, 'err');
  }
}

async function testCloudSettings() {
  try {
    const r = await fetch('/api/cloud/status');
    const d = await r.json();
    if (d.config_error) {
      log('Cloud config: ' + d.config_error, 'err');
      return;
    }
    log('Cloud config OK: ' + d.provider + (d.provider === 'google_drive' ? ' / ' + d.drive_mode : ''), 'ok');
    if (d.provider === 'ftp') {
      log('Testing FTP to ' + (d.host || '?') + ':' + (d.port || 21) + ' from PS5...');
      const tr = await fetch('/api/cloud/test_ftp');
      const td = await tr.json();
      if (td.ok) log(td.message || 'FTP test OK', 'ok');
      else log('FTP test failed (' + (td.stage || 'unknown') + '): ' + (td.error || 'unknown error'), 'err');
    }
  } catch (e) {
    log('Cloud status failed: ' + e.message, 'err');
  }
}

async function validateDriveToken(token) {
  token = normalizeDriveToken(token);
  if (!token) throw new Error('Add a Google Drive OAuth access token in Settings first');
  const r = await fetch('https://oauth2.googleapis.com/tokeninfo?access_token=' + encodeURIComponent(token));
  const txt = await r.text();
  if (!r.ok) throw new Error('Google Drive token is invalid or expired. Paste a fresh OAuth access token with Drive scope.');
  let info = {};
  try { info = JSON.parse(txt || '{}'); } catch(e) {}
  const scopes = (info.scope || '').split(/\s+/);
  const okScope = scopes.includes('https://www.googleapis.com/auth/drive')
    || scopes.includes('https://www.googleapis.com/auth/drive.file')
    || scopes.includes('https://www.googleapis.com/auth/drive.appdata');
  if (!okScope) throw new Error('Google Drive token is missing Drive scope. Use drive.file or drive scope.');
  localStorage.setItem('gdrive_access_token', token);
  return info;
}

async function testDriveToken() {
  try {
    const inputToken = $('setDriveAccessToken') ? $('setDriveAccessToken').value : '';
    const token = normalizeDriveToken(inputToken || localStorage.getItem('gdrive_access_token') || '');
    const info = await validateDriveToken(token);
    log('Google Drive access token OK' + (info.expires_in ? ' (expires in ' + info.expires_in + 's)' : ''), 'ok');
  } catch(e) {
    log('Google Drive access token failed: ' + e.message, 'err');
  }
}

function base64UrlString(s) {
  return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function base64UrlBytes(buf) {
  const bytes = new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function pemToArrayBuffer(pem) {
  const clean = (pem || '').replace(/-----BEGIN PRIVATE KEY-----/g, '')
    .replace(/-----END PRIVATE KEY-----/g, '').replace(/\s+/g, '');
  const bin = atob(clean);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

function utf8Bytes(s) {
  if (window.TextEncoder) return new TextEncoder().encode(s);
  const enc = unescape(encodeURIComponent(s));
  const out = new Uint8Array(enc.length);
  for (let i = 0; i < enc.length; i++) out[i] = enc.charCodeAt(i);
  return out;
}

function bytesToBigInt(bytes) {
  let hex = '';
  for (let i = 0; i < bytes.length; i++) {
    const h = bytes[i].toString(16);
    hex += h.length === 1 ? '0' + h : h;
  }
  return BigInt('0x' + (hex || '0'));
}

function bigIntToBytes(v, len) {
  let hex = v.toString(16);
  if (hex.length % 2) hex = '0' + hex;
  const raw = new Uint8Array(hex.length / 2);
  for (let i = 0; i < raw.length; i++) raw[i] = parseInt(hex.substr(i * 2, 2), 16);
  if (raw.length === len) return raw;
  const out = new Uint8Array(len);
  out.set(raw.slice(Math.max(0, raw.length - len)), Math.max(0, len - raw.length));
  return out;
}

function modPow(base, exp, mod) {
  let result = 1n;
  base %= mod;
  while (exp > 0n) {
    if (exp & 1n) result = (result * base) % mod;
    exp >>= 1n;
    base = (base * base) % mod;
  }
  return result;
}

function derElement(bytes, off, expectedTag) {
  const tag = bytes[off++];
  if (expectedTag !== undefined && tag !== expectedTag) throw new Error('Unsupported private key format');
  let len = bytes[off++];
  if (len & 0x80) {
    const n = len & 0x7f;
    len = 0;
    for (let i = 0; i < n; i++) len = (len << 8) | bytes[off++];
  }
  return { tag, start: off, end: off + len, next: off + len };
}

function derInteger(bytes, off) {
  const el = derElement(bytes, off, 0x02);
  let b = bytes.slice(el.start, el.end);
  while (b.length > 1 && b[0] === 0) b = b.slice(1);
  return { value: bytesToBigInt(b), next: el.next, byteLength: b.length };
}

function parsePkcs8RsaPrivateKey(pem) {
  if (typeof BigInt === 'undefined') throw new Error('This browser needs WebCrypto or BigInt to sign service-account JWTs');
  const bytes = new Uint8Array(pemToArrayBuffer(pem));
  const root = derElement(bytes, 0, 0x30);
  let off = root.start;
  off = derElement(bytes, off, 0x02).next;      // PrivateKeyInfo version
  off = derElement(bytes, off, 0x30).next;      // AlgorithmIdentifier
  const keyOctets = derElement(bytes, off, 0x04);
  const rsa = bytes.slice(keyOctets.start, keyOctets.end);
  const seq = derElement(rsa, 0, 0x30);
  off = seq.start;
  off = derElement(rsa, off, 0x02).next;        // RSAPrivateKey version
  const n = derInteger(rsa, off); off = n.next;
  off = derElement(rsa, off, 0x02).next;        // publicExponent
  const d = derInteger(rsa, off);
  return { n: n.value, d: d.value, k: n.byteLength };
}

function sha256Bytes(data) {
  const k = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bitLen = data.length * 8;
  const len = (((data.length + 9 + 63) >> 6) << 6);
  const msg = new Uint8Array(len);
  msg.set(data);
  msg[data.length] = 0x80;
  const dv = new DataView(msg.buffer);
  dv.setUint32(len - 4, bitLen >>> 0);
  dv.setUint32(len - 8, Math.floor(bitLen / 0x100000000));
  let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
  let h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
  const w = new Uint32Array(64);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let i = 0; i < msg.length; i += 64) {
    for (let t = 0; t < 16; t++) w[t] = dv.getUint32(i + t * 4);
    for (let t = 16; t < 64; t++) {
      const s0 = rotr(w[t - 15], 7) ^ rotr(w[t - 15], 18) ^ (w[t - 15] >>> 3);
      const s1 = rotr(w[t - 2], 17) ^ rotr(w[t - 2], 19) ^ (w[t - 2] >>> 10);
      w[t] = (w[t - 16] + s0 + w[t - 7] + s1) >>> 0;
    }
    let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
    for (let t = 0; t < 64; t++) {
      const s1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      const ch = (e & f) ^ (~e & g);
      const temp1 = (h + s1 + ch + k[t] + w[t]) >>> 0;
      const s0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const temp2 = (s0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + temp1) >>> 0;
      d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
    }
    h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0;
    h4 = (h4 + e) >>> 0; h5 = (h5 + f) >>> 0; h6 = (h6 + g) >>> 0; h7 = (h7 + h) >>> 0;
  }
  const out = new Uint8Array(32);
  const od = new DataView(out.buffer);
  [h0,h1,h2,h3,h4,h5,h6,h7].forEach((v, i) => od.setUint32(i * 4, v));
  return out;
}

function rsaSha256SignFallback(input, pem) {
  const key = parsePkcs8RsaPrivateKey(pem);
  const digest = sha256Bytes(utf8Bytes(input));
  const prefix = [0x30,0x31,0x30,0x0d,0x06,0x09,0x60,0x86,0x48,0x01,0x65,0x03,0x04,0x02,0x01,0x05,0x00,0x04,0x20];
  const tLen = prefix.length + digest.length;
  if (key.k < tLen + 11) throw new Error('RSA key is too small');
  const em = new Uint8Array(key.k);
  em[0] = 0; em[1] = 1;
  em.fill(0xff, 2, key.k - tLen - 1);
  em[key.k - tLen - 1] = 0;
  em.set(prefix, key.k - tLen);
  em.set(digest, key.k - digest.length);
  return bigIntToBytes(modPow(bytesToBigInt(em), key.d, key.n), key.k);
}

async function signServiceJwt(input, pem) {
  if (window.crypto && window.crypto.subtle) {
    const key = await window.crypto.subtle.importKey('pkcs8', pemToArrayBuffer(pem),
      { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['sign']);
    return new Uint8Array(await window.crypto.subtle.sign('RSASSA-PKCS1-v1_5', key, utf8Bytes(input)));
  }
  return rsaSha256SignFallback(input, pem);
}

function loadServiceAccount(cfg) {
  const local = localStorage.getItem('gdrive_service_account');
  if (local) return JSON.parse(local);
  const gd = (cfg && cfg.google_drive) || {};
  const sa = gd.service_account || {};
  if (sa.private_key && sa.private_key !== '********') return sa;
  throw new Error('Paste a Google service account JSON in Settings first');
}

async function serviceAccountAccessToken(cfg) {
  const sa = loadServiceAccount(cfg);
  if (!sa.client_email || !sa.private_key) throw new Error('Service account JSON must include client_email and private_key');
  const tokenUri = sa.token_uri || 'https://oauth2.googleapis.com/token';
  const now = Math.floor(Date.now() / 1000);
  const header = { alg: 'RS256', typ: 'JWT' };
  if (sa.private_key_id) header.kid = sa.private_key_id;
  const payload = {
    iss: sa.client_email,
    scope: 'https://www.googleapis.com/auth/drive',
    aud: tokenUri,
    iat: now,
    exp: now + 3600
  };
  const input = base64UrlString(JSON.stringify(header)) + '.' + base64UrlString(JSON.stringify(payload));
  const sig = await signServiceJwt(input, sa.private_key);
  const assertion = input + '.' + base64UrlBytes(sig);
  const r = await fetch(tokenUri, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'grant_type=' + encodeURIComponent('urn:ietf:params:oauth:grant-type:jwt-bearer') + '&assertion=' + encodeURIComponent(assertion)
  });
  const txt = await r.text();
  if (!r.ok) throw new Error('Service account token failed: HTTP ' + r.status + ' ' + txt);
  const d = JSON.parse(txt || '{}');
  if (!d.access_token) throw new Error('Service account token response did not include access_token');
  return d.access_token;
}

async function tryValidateDriveToken(token) {
  token = normalizeDriveToken(token);
  if (!token || token === '********') return null;
  try {
    await validateDriveToken(token);
    return token;
  } catch (e) {
    return null;
  }
}

function driveAuthMode(cfg) {
  const gd = (cfg && cfg.google_drive) || {};
  let mode = gd.auth_mode || localStorage.getItem('gdrive_auth_mode') || 'oauth_refresh';
  if (mode === 'oauth_token') mode = 'oauth_refresh';
  return mode;
}

function driveOAuthCredentials(cfg) {
  const gd = (cfg && cfg.google_drive) || {};
  return {
    clientId: ($('setDriveClientId') ? $('setDriveClientId').value.trim() : '') || gd.client_id || '',
    clientSecret: ($('setDriveClientSecret') ? $('setDriveClientSecret').value : '') || gd.client_secret || '',
    refreshToken: ($('setDriveRefreshToken') ? $('setDriveRefreshToken').value.trim() : '') || gd.refresh_token || '',
    accessToken: normalizeDriveToken(
      ($('setDriveAccessToken') ? $('setDriveAccessToken').value : '')
      || gd.access_token
      || localStorage.getItem('gdrive_access_token')
      || ''
    )
  };
}

async function oauthRefreshAccessToken(cfg) {
  const creds = driveOAuthCredentials(cfg);
  if (!creds.clientId) throw new Error('OAuth Client ID is required');
  if (!creds.clientSecret || creds.clientSecret === '********') throw new Error('OAuth Client Secret is required');
  if (!creds.refreshToken || creds.refreshToken === '********') throw new Error('OAuth Refresh Token is required');

  const cacheKey = 'gdrive_oauth_cache_' + creds.clientId.slice(-8);
  const cached = sessionStorage.getItem(cacheKey);
  if (cached) {
    try {
      const c = JSON.parse(cached);
      if (c.token && c.expires_at > Date.now() + 60000) return c.token;
    } catch (e) {}
  }

  const live = await tryValidateDriveToken(creds.accessToken);
  if (live) return live;

  const body = new URLSearchParams({
    client_id: creds.clientId,
    client_secret: creds.clientSecret,
    refresh_token: creds.refreshToken,
    grant_type: 'refresh_token'
  });
  const r = await fetch('https://oauth2.googleapis.com/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body.toString()
  });
  const txt = await r.text();
  if (!r.ok) throw new Error('OAuth refresh failed: HTTP ' + r.status + ' ' + txt);
  let d = {};
  try { d = JSON.parse(txt || '{}'); } catch (e) {}
  if (!d.access_token) throw new Error('OAuth refresh response did not include access_token');
  sessionStorage.setItem(cacheKey, JSON.stringify({
    token: d.access_token,
    expires_at: Date.now() + ((d.expires_in || 3600) - 60) * 1000
  }));
  localStorage.setItem('gdrive_access_token', d.access_token);
  return d.access_token;
}

async function driveAccessToken(cfg) {
  const mode = driveAuthMode(cfg);
  if (mode === 'oauth_refresh') return oauthRefreshAccessToken(cfg);
  return serviceAccountAccessToken(cfg);
}

async function testDriveAccess() {
  try {
    const cfg = await loadCloudConfigForAction();
    const token = await driveAccessToken(cfg);
    const folderId = ($('setDriveFolder') ? $('setDriveFolder').value.trim() : ((cfg.google_drive || {}).folder_id || ''));
    if (!folderId) throw new Error('Folder ID is required');
    const r = await fetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(folderId) + '?fields=id,name,mimeType,capabilities/canAddChildren&supportsAllDrives=true', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const txt = await r.text();
    if (!r.ok) {
      if (r.status === 404) {
        if (driveAuthMode(cfg) === 'oauth_refresh') {
          throw new Error('Drive folder was not found for this OAuth account. Check the Folder ID and tokens. Google said: ' + txt);
        } else {
          const sa = loadServiceAccount(cfg);
          throw new Error('Drive folder was not found or is not shared with service account '
            + (sa.client_email || '(missing client_email)') + '. Check the Folder ID and share the folder with that email. Google said: ' + txt);
        }
      }
      throw new Error('Drive folder check failed: HTTP ' + r.status + ' ' + txt);
    }
    const d = JSON.parse(txt || '{}');
    if (d.mimeType !== 'application/vnd.google-apps.folder') throw new Error('Drive ID is not a folder: ' + (d.name || d.id));
    if (d.capabilities && d.capabilities.canAddChildren === false) throw new Error('Drive auth can see the folder but cannot upload to it. Give this account Editor access.');
    log('Drive auth can access folder: ' + (d.name || d.id), 'ok');
  } catch(e) {
    log('Drive access test failed: ' + e.message, 'err');
  }
}

async function testServiceAccount() {
  return testDriveAccess();
}

/* ── Decrypt drop ──────────────────────────────────── */
async function decDrop(files) {
  if (bsy || !files.length) return;
  /* Check first byte to detect PS4 (0x01) vs PS5 (0x02) */
  const imgFile = files[0];
  const hdr = new Uint8Array(await imgFile.slice(0, 1).arrayBuffer());
  const isPS4 = (hdr[0] === 0x01);

  let binFile = null;
  if (isPS4) {
    /* Look for .bin in the dropped files */
    for (let i = 1; i < files.length; i++) {
      if (files[i].name.endsWith('.bin')) { binFile = files[i]; break; }
    }
    if (!binFile) {
      log('PS4 save detected — please drop both the save image and its .bin sealed key file together', 'err');
      return;
    }
  }

  bsy = true;
  $('ct').innerHTML = '<div class="drop"><div class="dlbl">' + t('status.uploading_decrypt', 'Uploading for decrypt...') + '</div></div>';
  try {
    /* For PS4, upload .bin key first */
    if (isPS4 && binFile) {
      log('Uploading PS4 sealed key ' + binFile.name + '...');
      const kxhr = await upload('/api/upload_key', binFile);
      if (kxhr.status !== 200) throw new Error('Failed to upload .bin key');
    }
    log('Uploading ' + imgFile.name + ' (' + fmtB(imgFile.size) + ')...');
    const xhr = await upload('/api/decrypt_upload' + (isPS4 ? '?ps4=1' : ''), imgFile, (loaded, total) => {
      const pct = Math.round(loaded * 100 / total);
      showProgress(pct, loaded, total);
    });
    if (xhr.status !== 200) {
      const d = JSON.parse(xhr.responseText);
      throw new Error(d.error || 'Failed');
    }
    log('Mounted — click Download to save decrypted files', 'ok');
    const name = imgFile.name.replace(/\.[^.]+$/, '') + '_dec.zip';
    $('ct').innerHTML =
      '<div class="drop"><div class="dlbl">' + t('status.decrypt_ok', 'Decrypted successfully!') + '</div>'
      + '<a class="dlnk" href="/api/download" download="' + esc(name) + '">' + t('status.download_zip', 'Download .zip') + '</a>'
      + '<br><button class="bbtn" style="margin-top:12px" onclick="fetch(\'/api/unmount\');renderCt()">' + t('status.done', 'Done') + '</button></div>';
  } catch (e) {
    log('Error: ' + e.message, 'err');
    renderCt();
  }
  bsy = false;
}

/* ── Encrypt drop ──────────────────────────────────── */
async function encDrop(files, folderName) {
  if (bsy || !files || !files.length) return;
  const aidv = document.getElementById('eaid') ? document.getElementById('eaid').value.trim() : '';
  const isPS4 = document.getElementById('eps4') ? document.getElementById('eps4').checked : false;
  bsy = true;

  try {
    /* Calculate total size for PFS image sizing */
    let totalSize = 0;
    for (const f of files) totalSize += f.size;

    /* Step 1: create fresh PFS image and mount it */
    log('Creating ' + (isPS4 ? 'PS4' : 'PS5') + ' PFS image (' + fmtB(totalSize) + ' of files)...');
    $('ct').innerHTML = '<div class="drop"><div class="dlbl">' + t('status.creating_pfs', 'Creating PFS image...') + '</div></div>';
    let r = await fetch('/api/create_pfs?size=' + totalSize + (isPS4 ? '&ps4=1' : ''));
    let d = await r.json();
    if (d.error) throw new Error(d.error);
    log('PFS image created and mounted', 'ok');

    /* Step 2: upload each file */
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      const path = f._path || f.webkitRelativePath || f.name;
      /* Strip leading folder name */
      const parts = path.split('/');
      const relPath = parts.length > 1 ? parts.slice(1).join('/') : parts[0];

      log('Uploading (' + (i + 1) + '/' + files.length + ') ' + relPath + ' (' + fmtB(f.size) + ')...');
      $('ct').innerHTML = '<div class="drop" id="dz"><div class="dlbl">' + t('status.uploading_file', 'Uploading {name}', {name: esc(relPath)})
        + '<br>(' + (i + 1) + '/' + files.length + ')</div></div>';

      const xhr = await upload('/api/upload_file?name=' + encodeURIComponent(relPath), f, (loaded, total) => {
        const pct = Math.round(loaded * 100 / total);
        showProgress(pct, loaded, total);
      });
      const rd = JSON.parse(xhr.responseText);
      if (!rd.ok) throw new Error(rd.error || 'Upload failed for ' + relPath);
    }
    log('All ' + files.length + ' files uploaded', 'ok');

    /* Step 3: patch AID if provided, unmount, download encrypted */
    log('Encrypting and downloading...');
    $('ct').innerHTML = '<div class="drop"><div class="dlbl">' + t('status.encrypting', 'Encrypting save...') + '</div></div>';
    const name = (folderName || 'encrypted_save') + '_enc';
    let dlUrl = '/api/download_new?name=' + encodeURIComponent(name);
    if (aidv) dlUrl += '&aid=' + encodeURIComponent(aidv);

    a.href = dlUrl;
    a.download = isPS4 ? (name + '_ps4.zip') : name;
    document.body.appendChild(a); a.click(); a.remove();

      $('ct').innerHTML =

        + '<div style="color:#0f0">' + t('status.download_started_zip', 'Download started (.zip)') + '</div>'
        + '<div style="font-size:11px;color:var(--dm);margin-top:8px">' + t('status.ps4_extract_hint', 'Extract and place both files in the same directory on PS5') + '</div></div>';
    } else {
      $('ct').innerHTML =
        '<div class="drop"><div class="dlbl">' + esc(name) + '</div>'
        + '<div style="color:#0f0">' + t('status.download_started', 'Download started') + '</div></div>';

  } catch (e) {
    log('Error: ' + e.message, 'err');
    renderCt();
  }
  bsy = false;
}

/* ── Resign drop ───────────────────────────────────── */
async function resignDrop(files) {
  if (bsy || !files.length) return;
  const aidv = document.getElementById('raid').value.trim();
  if (!aidv) { log('Enter new Account ID first', 'err'); return }

  /* Find image file (largest non-.bin) and detect PS4 */
  let imgFile = null, binFile = null;
  for (let i = 0; i < files.length; i++) {
    if (files[i].name.endsWith('.bin')) binFile = files[i];
    else if (!imgFile || files[i].size > imgFile.size) imgFile = files[i];
  }
  if (!imgFile) return;

  const hdr = new Uint8Array(await imgFile.slice(0, 1).arrayBuffer());
  const isPS4 = (hdr[0] === 0x01);

  if (isPS4 && !binFile) {
    log('PS4 save detected — please drop both the save image and its .bin sealed key file together', 'err');
    return;
  }

  bsy = true;
  $('ct').innerHTML = '<div class="drop"><div class="dlbl">' + t('status.uploading_resign', 'Uploading for resign...') + '</div></div>';
  try {
    /* For PS4, upload .bin key first */
    if (isPS4 && binFile) {
      log('Uploading PS4 sealed key ' + binFile.name + '...');
      const kxhr = await upload('/api/upload_key', binFile);
      if (kxhr.status !== 200) throw new Error('Failed to upload .bin key');
    }

    const uidv = document.getElementById('ruid') ? document.getElementById('ruid').value.trim() : '';
    log('Uploading ' + imgFile.name + ' (' + fmtB(imgFile.size) + ') for resign...');
    let rurl = '/api/resign?aid=' + encodeURIComponent(aidv);
    if (isPS4) rurl += '&ps4=1';
    if (uidv) rurl += '&uid=' + encodeURIComponent(uidv);
    const xhr = await upload(rurl, imgFile, (loaded, total) => {
      const pct = Math.round(loaded * 100 / total);
      showProgress(pct, loaded, total);
    });
    const d = JSON.parse(xhr.responseText);
    if (d.error) throw new Error(d.error);
    log('Resigned ' + fmtB(d.size) + ', starting download...', 'ok');
    const name = imgFile.name.replace(/\.[^.]+$/, '') + '_resigned';
    const a = document.createElement('a');
    a.href = '/api/resign_download?name=' + encodeURIComponent(name) + (isPS4 ? '&ps4=1' : '');
    a.download = isPS4 ? (name + '.zip') : name;
    document.body.appendChild(a); a.click(); a.remove();
    $('ct').innerHTML =
      '<div class="drop"><div class="dlbl">' + esc(name) + '<br>' + fmtB(d.size) + '</div>'
      + '<div style="color:#0f0">' + (isPS4 ? t('status.download_started_zip', 'Download started (.zip)') : t('status.download_started', 'Download started')) + '</div>'
      + '<button class="bbtn" style="margin-top:12px" onclick="switchTab(\'resign\')">' + t('status.resign_another', 'Resign Another') + '</button></div>';
  } catch (e) {
    log('Error: ' + e.message, 'err');
    renderCt();
  }
  bsy = false;
}

/* ── Import drop ───────────────────────────────────── */
async function importDrop(files, folderName) {
  if (bsy || !files || !files.length) return;

  /* Check for sce_sys/param.sfo in the dropped files */
  let hasSfo = false;
  for (const f of files) {
    const p = f._path || f.webkitRelativePath || f.name;
    if (p.match(/sce_sys\/param\.sfo$/i)) { hasSfo = true; break; }
  }
  if (!hasSfo) {
    log('Folder must contain sce_sys/param.sfo', 'err');
    return;
  }

  bsy = true;
  try {
    /* Calculate total size */
    let totalSize = 0;
    for (const f of files) totalSize += f.size;

    /* Step 1: create PFS image */
    log('Creating PFS image for import (' + fmtB(totalSize) + ' of files)...');
    $('ct').innerHTML = '<div class="drop"><div class="dlbl">' + t('status.creating_pfs', 'Creating PFS image...') + '</div></div>';
    let r = await fetch('/api/create_pfs?size=' + totalSize);
    let d = await r.json();
    if (d.error) throw new Error(d.error);
    log('PFS image created and mounted', 'ok');

    /* Step 2: upload each file */
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      const path = f._path || f.webkitRelativePath || f.name;
      const parts = path.split('/');
      const relPath = parts.length > 1 ? parts.slice(1).join('/') : parts[0];

      log('Uploading (' + (i + 1) + '/' + files.length + ') ' + relPath + ' (' + fmtB(f.size) + ')...');
      $('ct').innerHTML = '<div class="drop" id="dz"><div class="dlbl">' + t('status.uploading_file', 'Uploading {name}', {name: esc(relPath)})
        + '<br>(' + (i + 1) + '/' + files.length + ')</div></div>';

      const xhr = await upload('/api/upload_file?name=' + encodeURIComponent(relPath), f, (loaded, total) => {
        const pct = Math.round(loaded * 100 / total);
        showProgress(pct, loaded, total);
      });
      const rd = JSON.parse(xhr.responseText);
      if (!rd.ok) throw new Error(rd.error || 'Upload failed for ' + relPath);
    }
    log('All ' + files.length + ' files uploaded', 'ok');

    /* Check if save already exists */
    r = await fetch('/api/import_check?uid=' + encodeURIComponent(curUid));
    d = await r.json();
    if (d.exists) {
      const ok = await showConfirmModal(t('confirm.overwrite_save', 'This will overwrite an existing save. Are you sure?'));
      if (!ok) {
        log('Import cancelled');
        try { await fetch('/api/unmount'); } catch(x) {}
        renderCt(); bsy = false; return;
      }
    }

    /* Step 3: finalize import (resign, unmount, copy to system, update DB) */
    await doImportFinish();

  } catch (e) {
    log('Import error: ' + e.message, 'err');
    /* Try to clean up by unmounting */
    try { await fetch('/api/unmount'); } catch(x) {}
    renderCt();
  }
  bsy = false;
}

/* ── Import DZ setup (accepts both folders and files) ── */
function setupImportDZ(id) {
  const el = $(id);
  if (!el) return;
  el.ondragover = e => { e.preventDefault(); el.classList.add('over') };
  el.ondragleave = e => { e.preventDefault(); el.classList.remove('over') };
  el.ondrop = async e => {
    e.preventDefault(); el.classList.remove('over');
    const items = e.dataTransfer.items;
    const entries = [];
    if (items) {
      for (let i = 0; i < items.length; i++) {
        const entry = items[i].webkitGetAsEntry ? items[i].webkitGetAsEntry() : null;
        if (entry) entries.push(entry);
      }
    }
    if (entries.length && entries[0].isDirectory) {
      const all = await readEntryRecursive(entries[0], '');
      if (all.length) importDrop(all, entries[0].name);
    } else {
      importEncrypted(e.dataTransfer.files);
    }
  };
}

/* ── Import encrypted save ─────────────────────────── */
async function importEncrypted(files) {
  if (bsy || !files.length) return;

  /* Find image file (largest non-.bin) and detect PS4 */
  let imgFile = null, binFile = null;
  for (let i = 0; i < files.length; i++) {
    if (files[i].name.endsWith('.bin')) binFile = files[i];
    else if (!imgFile || files[i].size > imgFile.size) imgFile = files[i];
  }
  if (!imgFile) { log('No save file found', 'err'); return; }

  const hdr = new Uint8Array(await imgFile.slice(0, 1).arrayBuffer());
  const isPS4 = (hdr[0] === 0x01);

  if (isPS4 && !binFile) {
    log('PS4 save detected — drop both the save image and .bin key together', 'err');
    return;
  }

  bsy = true;
  $('ct').innerHTML = '<div class="drop"><div class="dlbl">' + t('status.uploading_encrypted', 'Uploading encrypted save...') + '</div></div>';
  try {
    /* Upload .bin key first if PS4 */
    if (isPS4 && binFile) {
      log('Uploading PS4 sealed key ' + binFile.name + '...');
      const kxhr = await upload('/api/upload_key', binFile);
      if (kxhr.status !== 200) throw new Error('Failed to upload .bin key');
    }

    log('Uploading ' + imgFile.name + ' (' + fmtB(imgFile.size) + ')...');
    const xhr = await upload('/api/import_encrypted?uid=' + encodeURIComponent(curUid) + (isPS4 ? '&ps4=1' : ''), imgFile, (loaded, total) => {
      showProgress(Math.round(loaded * 100 / total), loaded, total);
    });
    const d = JSON.parse(xhr.responseText);
    if (d.error) throw new Error(d.error);

    if (d.sfo_zeroed) {
      log('Encrypted save has zeroed param.sfo', 'err');
      await doImportFinish();
      bsy = false;
      return;
    }

    log('Save verified: ' + d.title_id + ' / ' + d.dir_name, 'ok');

    /* Check if save already exists */
    if (d.exists) {
      const ok = await showConfirmModal(t('confirm.overwrite_save', 'This will overwrite an existing save. Are you sure?'));
      if (!ok) {
        log('Import cancelled');
        try { await fetch('/api/unmount'); } catch(x) {}
        renderCt(); bsy = false; return;
      }
    }

    if (d.match) {
      /* Account ID matches — proceed to import */
      await doImportFinish();
    } else {
      /* Account ID mismatch — show modal */
      const resign = await showConfirmModal(
        t('import.account_mismatch', 'Account ID Mismatch!') + '<br><br>'
        + '<span style="font-size:13px;color:var(--dm)">'
        + t('import.save_account', 'Save') + ': <b style="color:var(--tx)">' + esc(d.save_aid) + '</b><br>'
        + t('import.your_account', 'Your account') + ': <b style="color:var(--tx)">' + esc(d.user_aid) + '</b></span><br><br>'
        + t('import.resign_question', 'Do you want to resign to your account ID?'),
        t('import.yes_resign', 'Yes, Resign'), t('common.cancel', 'Cancel'));
      if (resign) {
        await doImportFinish();
      } else {
        log('Import cancelled');
        try { await fetch('/api/unmount'); } catch(x) {}
        renderCt();
      }
    }
  } catch (e) {
    log('Import error: ' + e.message, 'err');
    try { await fetch('/api/unmount'); } catch(x) {}
    renderCt();
  }
  bsy = false;
}

}

    ).join('') : '<div style="padding:16px;color:var(--dm);font-size:12px">' + t('import.no_titles', 'No titles found in database') + '</div>';

      + '<div style="font-size:14px;color:var(--tx);font-weight:600">' + t('import.zeroed_sfo', 'Zeroed param.sfo detected') + '</div>'
      + '<div style="font-size:12px;color:var(--dm);margin-top:4px">' + t('import.select_title_regen', 'Select a title from the database to regenerate') + '</div></div>'
      + '<div id="sfList" style="overflow-y:auto;max-height:40vh">' + listHtml + '</div>'
      + '<div id="sfStatus" style="font-size:11px;color:var(--dm);padding:4px 20px;min-height:16px"></div>'

      + '<button class="btn red" style="flex:1" id="sfCancel">' + t('common.cancel', 'Cancel') + '</button></div></div>';

        row.style.background = 'var(--ac)';
        row.style.borderRadius = '6px';
        m.querySelector('#sfStatus').textContent = t('import.regenerating', 'Regenerating from {source}...', {source: title.tid + '/' + title.dir});

      };
    });
    if (hasAnyway) {
      m.querySelector('#sfAnyway').onclick = () => { m.remove(); resolve({type:'anyway', tid:'', dir:''}); };
    }
    m.querySelector('#sfCancel').onclick = () => { m.remove(); resolve('cancel'); };

}

async function doImportFinish() {
  log('Importing to system...');
  $('ct').innerHTML = '<div class="drop"><div class="dlbl">' + t('status.importing', 'Importing save to system...') + '</div></div>';
  let r = await fetch('/api/import_finish?uid=' + encodeURIComponent(curUid));
  let d = await r.json();
  if (d.sfo_zeroed) {
    const choice = await showSfoModal({anyway: true});
    if (choice && choice.type === 'regen') {
      log('param.sfo regenerated', 'ok');
      r = await fetch('/api/import_finish?uid=' + encodeURIComponent(curUid));
      d = await r.json();
      if (d.error) throw new Error(d.error);
    } else if (choice && choice.type === 'anyway') {
      log('Importing with zeroed param.sfo...');
      r = await fetch('/api/import_finish?uid=' + encodeURIComponent(curUid) + '&force=1');
      d = await r.json();
      if (d.error) throw new Error(d.error);
    } else {
      log('Import cancelled');
      try { await fetch('/api/unmount'); } catch(x) {}
      renderCt();
      return;
    }
  }
  if (d.error) throw new Error(d.error);
  log('Import complete: ' + d.title_id + '/' + d.dir_name + (d.exists ? ' (updated)' : ' (new)'), 'ok');
  showImportSuccess(d);
}

/* ── Mount & browse save ───────────────────────────── */
async function mountBrw(i) {
  if (bsy) return;
  bsy = true;
  const s = S[i];
  try {
    log('Mounting ' + s.title_id + '/' + s.save_name + '...');
    let r = await fetch('/api/mount?idx=' + i);
    let d = await r.json();
    if (d.error) { log('Mount failed: ' + d.error, 'err'); bsy = false; renderCt(); return }
    mt = true;
    cf = d.files || [];
    aid = d.account_id || '';
    stitle = d.save_title || '';
    mtid = d.title_id || '';
    mpt = d.mount || '';
    ex = new Set();
    /* folders start collapsed */
    log('Mounted ' + (mtid ? mtid + ' ' : '') + (stitle ? stitle + ' ' : '') + (aid ? '[' + aid + ']' : ''), 'ok');
    renderF();
    if (d.sfo_zeroed) {
      const result = await showSfoModal({anyway: false});
      if (result && result.type === 'regen') {
        log('param.sfo regenerated', 'ok');
        let r2 = await fetch('/api/mount?idx=' + i);
        let d2 = await r2.json();
        if (!d2.error) {
          cf = d2.files || [];
          aid = d2.account_id || '';
          stitle = d2.save_title || '';
          mtid = d2.title_id || '';
          renderF();
        }
      }
    }
  } catch (e) {
    log('Error: ' + e.message, 'err');
  }
  bsy = false;
  renderTB();
}

/* ── Render file tree ──────────────────────────────── */
function renderF() {
  $('ct').className = 'ct';
  const isUsb = si >= 0 && S[si] && S[si].usb;
  let h = '';
  cf.forEach((f, i) => {
    const ps = f.name.split('/');
    ps.pop();
    let pp = '', vis = true;
    for (let j = 0; j < ps.length; j++) {
      pp = j ? pp + '/' + ps[j] : ps[j];
      if (!ex.has(pp)) { vis = false; break }
    }
    if (!vis) return;
    const d = f.name.split('/').length - 1;
    const nm = f.name.split('/').pop();
    if (f.dir) {
      const o = ex.has(f.name);
      const fn = esc(f.name).replace(/'/g, "\\'");
      h += '<div class="fi dir" style="padding-left:' + (16 + d * 16) + 'px" onclick="tog(' + i + ')">';
      h += (o ? '\u25BE \u{1F4C1} ' : '\u25B8 \u{1F4C1} ') + esc(nm);
      if (!isUsb) h += '<span class="dir-dots" onclick="event.stopPropagation();showDirMenu(event,\'' + fn + '\')">\u22EE</span>';
      h += '</div>';
    } else {
      const fn = esc(f.name).replace(/'/g, "\\'");
      const clickAttr = ' onclick="openEditor(\'' + fn + '\',' + f.size + ')" style="cursor:pointer;padding-left:' + (16 + d * 16) + 'px"';
      if (isUsb) {
        h += '<div class="fi"' + clickAttr + '>';
      } else {
        h += '<div class="fi"' + clickAttr + ' oncontextmenu="showCtxMenu(event,\'' + fn + '\')">';
      }
      h += '\u{1F4C4} ' + esc(nm)
        + '<span class="dir-dots" onclick="event.stopPropagation();showCtxMenu(event,\'' + fn + '\')">\u22EE</span>'
        + '<span class="sz">' + fmtB(f.size) + '</span></div>';
    }
  });
  if (!isUsb) h += '<div class="dh" style="opacity:1;font-size:12px">' + t('file.tip', 'Tip: Drag & drop files here to add or replace them') + '</div>';
  $('ct').innerHTML = h || '<div class="empty">' + t('common.empty', 'Empty') + '</div>';
  if (!isUsb) {
    $('ct').oncontextmenu = e => {
      if (!e.target.closest('.fi:not(.dir)')) { e.preventDefault(); showCtxMenu(e, null); }
    };
    setupDZ('ct', handleBrw);
  }
}

function showDirMenu(e, dirName) {
